# Labelled opportunity cards for comparing judge models with `lom eval-judge` (26 Oct 2026).
# Each card was written by hand from the fixture corpus, so no candidate judge reviews its own lab's writing. The
# evidence lines and the Nan Fung context are frozen exactly as production renders them for the judge
# (subagents._evidence_texts and _investigation_context, read from the seeded database on 26 Oct 2026).
# A supported card states only facts the evidence or the context gives. An unsupported card plants one error, named in
# `flaw`; it is consistent with itself, so only the evidence or the context reveals it. Production's evidence lines
# leave out a chunk's heading and a document's date, so no card's label depends on either (first run, 26 Oct 2026:
# two judges rightly rejected cards that named a note's year).
context: |-
  Nan Fung's London portfolio:
  - 108 Cannon Street, 108 Cannon Street, London EC4 (City Core; 38,800 sq ft; owned). City office of 38,800 sq ft, bought in 2016.
  - 138 Cheapside, 138 Cheapside, London EC2 (City Core; size not public; owned). City office bought in 2016.
  - 16 Old Bailey, 16 Old Bailey, London EC4 (City Core; size not public; owned). City office bought in 2015.
  - 99 City Road, 99 City Road, London EC1 (City Fringe; 475,000 sq ft; under development). A 36-storey office tower of 475,000 sq ft at Old Street. Multiplex is the main contractor; construction starts in Q3 2026 and completion is expected in 2030.
  - Regent Quarter, Regent Quarter, King's Cross, London N1 (King's Cross/Euston; size not public; owned (Endurance Land platform)). Mixed-use estate next to King's Cross station, bought in December 2017 for about £302.75m. A planning resolution in 2023 allows a life-science-led redevelopment. OpenAI leased 88,500 sq ft here (April 2026).

  Nan Fung's mandate (illustrative). strategies: value-add refurbishment, development and pre-let, core-plus; size band sqft: 30000, 150000; target submarkets: City Core, City Fringe, King's Cross/Euston, Midtown; signals of interest: distressed owners and refinancing, lease expiries, AI and life-science demand, Grade A supply gap, EPC upgrade (2031 EPC B rule).
  - Buy City Core and City Fringe offices of 30,000 to 150,000 sq ft from distressed owners or forced sellers, below replacement cost.
  - Refurbish secondary offices to Grade A and EPC B ahead of the 2031 minimum standard for buildings over 1,000 square metres.
  - Pre-let new Grade A space to AI, technology and life-science occupiers around King's Cross and Euston.
  - Track the Grade A supply gap and competing schemes that affect lettings at 99 City Road.
  - Watch refinancing pressure on owners who bought London offices in 2017 and 2018 and now face loan maturities.
  - Watch lease expiries and occupier moves that leave City buildings vacant or under-let.
  - Watch Hong Kong and other Asian owners selling London offices, as potential off-market opportunities.
  - Treat rent and yield movements in our submarkets as evidence for valuation and leasing decisions.

