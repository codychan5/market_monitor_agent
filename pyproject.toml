[project]
name = "london-office-monitor"
version = "0.1.0"
description = "Proof of concept: an AI agent that helps a buy-side analyst monitor the London office market"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.4.7,<1.5",
  "langgraph>=1.2.12,<1.3",
  "langchain-openai>=1.7,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "langchain-mcp-adapters>=0.3.2,<0.4",
  # langchain-mcp-adapters 0.3 requires mcp below 2
  "mcp>=1.24,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2",
  "pgvector>=0.5,<0.6",
  "fastembed>=0.9,<0.10",
  "streamlit>=1.66,<2",
  "feedparser>=6.0.14,<7",
  "typer>=0.15,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "pyyaml>=6",
  "uvicorn>=0.31",
  "starlette>=0.46",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
lom = "london_office_monitor.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["london_office_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests call OpenRouter and spend credit: run them explicitly with -m live.
addopts = ["-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 60
markers = [
  "db: needs the compose database",
  "embedding: downloads the real embedding model",
  "live: calls OpenRouter",
]

[tool.ruff]
line-length = 120
target-version = "py312"
